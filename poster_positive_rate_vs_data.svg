<line class="axis" x1="90" y1="430" x2="860" y2="430"/>
<line class="axis" x1="90" y1="70" x2="90" y2="430"/>
<text class="label" transform="translate(24,250.0) rotate(-90)" text-anchor="middle">% of settings with BLEU delta &gt; 0</text>
