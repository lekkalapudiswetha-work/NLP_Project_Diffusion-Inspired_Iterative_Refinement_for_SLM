<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
<style>
.bg { fill: #fffdf8; }
.title { font: 700 24px Arial, sans-serif; fill: #1f2937; }
.label { font: 14px Arial, sans-serif; fill: #374151; }
.small { font: 12px Arial, sans-serif; fill: #4b5563; }
.value { font: 700 12px Arial, sans-serif; fill: #111827; }
.axis { stroke: #6b7280; stroke-width: 1; }
.grid { stroke: #e5e7eb; stroke-width: 1; }
.legend { font: 13px Arial, sans-serif; fill: #374151; }
</style>
<rect class="bg" x="0" y="0" width="900" height="520"/>
<text class="title" x="90" y="40">How Often Diffusion Beats Baseline</text>
